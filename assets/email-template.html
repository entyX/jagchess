<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{subject}}</title>
  <style>
    body { margin:0; padding:0; background:#f0ece3; }
    a { color:#b8922a; text-decoration:none; }
    a:hover { text-decoration:underline; }
  </style>
</head>
<body style="margin:0;padding:0;background:#f0ece3;font-family:Georgia,'Times New Roman',serif;">

  <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f0ece3;">
    <tr>
      <td align="center" style="padding:48px 16px 40px;">

        <!-- ── Outer card ── -->
        <table cellpadding="0" cellspacing="0" border="0"
               style="width:100%;max-width:860px;background:#ffffff;border-radius:10px;
                      overflow:hidden;border:1px solid #e2ddd4;
                      box-shadow:0 4px 24px rgba(0,0,0,0.07);">

          <!-- ═══ HEADER ═══ -->
          <tr>
            <td style="background:#18181b;padding:30px 40px 26px;">
              <table width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td>
                    <!-- Chess piece + wordmark -->
                    <table cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td style="vertical-align:middle;padding-right:12px;">
                          <img src="https://nchs-chess-club.web.app/logo.png"
                               alt="Jagchess Logo"
                               width="52" height="52"
                               style="display:block;border-radius:50%;" />
                        </td>
                        <td style="vertical-align:middle;">
                          <div style="font-family:Georgia,serif;font-size:20px;font-weight:700;
                                      color:#ffffff;letter-spacing:0.3px;line-height:1.1;">
                            Jagchess
                          </div>
                          <div style="font-family:Arial,Helvetica,sans-serif;font-size:10px;
                                      font-weight:600;letter-spacing:2.2px;text-transform:uppercase;
                                      color:rgba(255,255,255,0.38);margin-top:3px;">
                            North Creek Chess Club
                          </div>
                        </td>
                      </tr>
                    </table>
                  </td>
                  <td align="right" style="vertical-align:middle;">
                    <span style="font-family:Arial,Helvetica,sans-serif;font-size:10px;
                                 font-weight:700;letter-spacing:2px;text-transform:uppercase;
                                 color:rgba(201,168,76,0.75);
                                 border:1px solid rgba(201,168,76,0.3);
                                 border-radius:2px;padding:4px 9px;white-space:nowrap;">
                      Announcement
                    </span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Gold accent line -->
          <tr>
            <td height="3" bgcolor="#c9a84c"
                style="font-size:0;line-height:0;background:#c9a84c;">&nbsp;</td>
          </tr>

          <!-- ═══ SUBJECT BANNER ═══ -->
          <tr>
            <td style="padding:32px 40px 24px;border-bottom:1px solid #ede9e0;">
              <div style="font-family:Georgia,'Times New Roman',serif;
                          font-size:24px;font-weight:700;color:#18181b;
                          line-height:1.28;letter-spacing:-0.3px;">
                {{subject}}
              </div>
            </td>
          </tr>

          <!-- ═══ BODY ═══ -->
          <tr>
            <td style="padding:28px 40px 32px;">
              <div style="font-family:Georgia,'Times New Roman',serif;
                          font-size:15.5px;line-height:1.8;color:#2c2924;">
                {{message_html}}
              </div>
            </td>
          </tr>

          <!-- ═══ CTA BUTTON ═══ -->
          <tr>
            <td style="padding:0 40px 36px;">
              <table cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="background:#18181b;border-radius:6px;">
                    <a href="https://nchs-chess-club.web.app"
                       style="display:inline-block;font-family:Arial,Helvetica,sans-serif;
                              font-size:12px;font-weight:700;letter-spacing:1.5px;
                              text-transform:uppercase;color:#ffffff;
                              padding:12px 24px;text-decoration:none;white-space:nowrap;">
                      Open Jagchess &nbsp;→
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- ═══ FOOTER ═══ -->
          <tr>
            <td style="background:#f7f5f0;border-top:1px solid #ede9e0;padding:20px 40px 22px;">
              <table width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="vertical-align:middle;">
                    <img src="https://nchs-chess-club.web.app/logo.png"
                         alt="" width="24" height="24"
                         style="display:inline-block;border-radius:50%;vertical-align:middle;" />
                    <span style="font-family:Georgia,serif;font-size:13px;font-weight:700;
                                 color:#6b6256;margin-left:7px;vertical-align:middle;">
                      Jagchess
                    </span>
                  </td>
                  <td align="right" style="vertical-align:middle;">
                    <span style="font-family:Arial,Helvetica,sans-serif;font-size:11px;
                                 color:#a09380;line-height:1.5;">
                      North Creek High School
                    </span>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

        </table>
        <!-- /card -->

        <!-- Below-card caption -->
        <table cellpadding="0" cellspacing="0" border="0"
               style="width:100%;max-width:860px;margin-top:18px;">
          <tr>
            <td align="center"
                style="font-family:Arial,Helvetica,sans-serif;font-size:11px;
                       color:#a09380;line-height:1.7;">
              You're receiving this because you're a registered Jagchess member.<br>
              <a href="https://nchs-chess-club.web.app"
                 style="color:#b8922a;text-decoration:none;">
                nchs-chess-club.web.app
              </a>
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>

</body>
</html>
